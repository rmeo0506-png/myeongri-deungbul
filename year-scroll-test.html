<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>명리등불 연도 선택 테스트</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 15px;background:#f4f5f7;font-family:system-ui,sans-serif}.panel{max-width:520px;margin:auto;background:#111d35;color:white;border-radius:24px;padding:25px 18px}h1{text-align:center;color:#e9c77a;margin:0}small{display:block;text-align:center;color:#cbd2df;margin:12px 0 28px}hr{border:0;border-top:1px solid #43516a;margin-bottom:28px}h3{font-size:18px}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.field{min-width:0;position:relative}label{display:block;color:#e9c77a;font-size:13px;margin-bottom:8px}button,select{height:48px;width:100%;border:1px solid #52617b;border-radius:9px;background:#111d35;color:white;font-size:16px;padding:6px}#yearButton{display:flex;justify-content:space-around;align-items:center}.summary{margin-top:20px;background:#263650;border-radius:14px;text-align:center;padding:24px 8px;color:#e9c77a}.summary small{margin:0 0 10px}.picker{position:absolute;left:0;top:77px;width:190px;height:350px;z-index:99;background:#202020;border-radius:20px;overflow-y:scroll;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none;box-shadow:0 10px 30px #0009}.picker::-webkit-scrollbar{display:none}.picker[hidden]{display:none}.year-option{display:flex;align-items:center;justify-content:center;height:65px;border:0;background:transparent;border-radius:0;font-size:21px;touch-action:pan-y}.year-option:active{background:#393939}.hint{max-width:520px;margin:20px auto;text-align:center;color:#4a5568;font-size:14px}</style></head><body><main class="panel"><h1>명리등불</h1><small>흐르는 삶에, 등불 하나.</small><hr><h3>태어난 날짜와 시간을 선택하세요.</h3><div class="fields"><div class="field"><label>출생 연도</label><button id="yearButton" type="button"><span id="yearText">20...</span><span>⌄</span></button><div id="picker" class="picker" hidden></div></div><div class="field"><label>월</label><select id="month"></select></div><div class="field"><label>일</label><select id="day"></select></div><div class="field"><label>시간</label><select id="hour"></select></div></div><div class="summary"><small>선택한 출생 정보</small><strong id="result">20...년 00월 00일</strong><div id="timeResult" style="margin-top:10px">00시</div></div></main><p class="hint">시험 전용 페이지입니다. 출생 연도 20...을 눌러 손가락으로 움직여 보세요.</p><script>const picker=document.querySelector('#picker'),button=document.querySelector('#yearButton'),yearText=document.querySelector('#yearText'),month=document.querySelector('#month'),day=document.querySelector('#day'),hour=document.querySelector('#hour');let chosen=null;const pad=n=>String(n).padStart(2,'0');function option(el,v,t){let o=document.createElement('option');o.value=v;o.textContent=t;el.append(o)}option(month,'00','00월');for(let i=1;i<=12;i++)option(month,pad(i),pad(i)+'월');option(day,'00','00일');for(let i=1;i<=31;i++)option(day,pad(i),pad(i)+'일');option(hour,'00','00시');for(let i=1;i<=23;i++)option(hour,pad(i),pad(i)+'시');option(hour,'unknown','모름');function update(){document.querySelector('#result').textContent=(chosen??'20...')+'년 '+month.value+'월 '+day.value+'일';document.querySelector('#timeResult').textContent=hour.value==='unknown'?'시간 모름':hour.value+'시'}for(let y=1900;y<=2026;y++){let el=document.createElement('button');el.className='year-option';el.type='button';el.dataset.year=y;el.textContent=y+'년';el.addEventListener('click',()=>{chosen=y;yearText.textContent=y+'년';picker.hidden=true;update()});picker.append(el)}button.addEventListener('click',()=>{picker.hidden=!picker.hidden;if(!picker.hidden){const selected=picker.querySelector('[data-year="'+(chosen??2000)+'"]');picker.scrollTop=selected.offsetTop-(picker.clientHeight-selected.offsetHeight)/2}});[month,day,hour].forEach(x=>x.addEventListener('change',update));document.addEventListener('pointerdown',e=>{if(!picker.contains(e.target)&&!button.contains(e.target))picker.hidden=true});update();</script></body></html>
